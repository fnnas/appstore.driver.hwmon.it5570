name: Kernel Space

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
        default: "appstore.driver.hwmon.it5570"
      driver_revision:
        required: true
        type: string
      kernel_name:
        required: true
        type: string
      kernel_ver:
        required: true
        type: string
      container_image:
        required: true
        type: string
      enable_ccache:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
      options: -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      kernel_name: ${{ inputs.kernel_name }}
      kernel_ver: ${{ inputs.kernel_ver }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G
      CCACHE_KEY: ccache-${{ inputs.kernel_name }}-it5570-${{ github.run_id }}-${{ github.run_attempt }}
      CCACHE_RESTORE_PREFIX: ccache-${{ inputs.kernel_name }}-it5570-
    steps:
      - name: Prepare ccache path
        if: ${{ inputs.enable_ccache }}
        shell: bash
        run: |
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache/${kernel_name}" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: ${{ inputs.enable_ccache }}
        id: restore_ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            ${{ env.CCACHE_RESTORE_PREFIX }}

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up ccache
        if: ${{ inputs.enable_ccache }}
        id: setup_ccache
        shell: bash
        run: |
          apt-get update
          apt-get install -y ccache
          mkdir -p "$CCACHE_DIR" "$GITHUB_WORKSPACE/ccache-bin"
          ccache_path="$(command -v ccache)"
          declare -A seen=()
          while IFS= read -r compiler; do
            case "$compiler" in
              gcc|g++|cc|c++|gcc-[0-9]*|g++-[0-9]*|cc-[0-9]*|c++-[0-9]*|*-gcc|*-g++|*-cc|*-c++|*-gcc-[0-9]*|*-g++-[0-9]*|*-cc-[0-9]*|*-c++-[0-9]*)
                [[ -n "${seen[$compiler]+x}" ]] && continue
                compiler_path="$(command -v "$compiler" || true)"
                [[ -x "$compiler_path" ]] || continue
                ln -sf "$ccache_path" "$GITHUB_WORKSPACE/ccache-bin/$compiler"
                seen[$compiler]=1
                ;;
            esac
          done < <(compgen -c | sort -u)
          echo "$GITHUB_WORKSPACE/ccache-bin" >> "$GITHUB_PATH"
          ccache --version
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=path="$PATH"
          ccache --zero-stats
          ccache --show-config
          echo "ccache wrappers:"
          find "$GITHUB_WORKSPACE/ccache-bin" -maxdepth 1 -type l -printf '%f -> %l\n' | sort

      - name: Build IT5570 hwmon module
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "compiler resolution before build:"
            for compiler in cc gcc g++ c++ x86_64-linux-gnu-gcc x86_64-linux-gnu-g++; do
              if command -v "$compiler" >/dev/null 2>&1; then
                echo "$compiler -> $(command -v "$compiler")"
              fi
            done
          fi
          make -C drv TARGET="${kernel_ver}" GIT_COMMIT="${{ inputs.driver_revision }}" -j"$(nproc)"
          test -f drv/it5570_hwmon.ko
          modinfo drv/it5570_hwmon.ko
          test "$(modinfo -F revision drv/it5570_hwmon.ko)" = "${{ inputs.driver_revision }}"

      - name: Show ccache stats
        if: ${{ always() && inputs.enable_ccache }}
        shell: bash
        run: ccache --show-stats || true

      - name: Save ccache
        if: ${{ always() && inputs.enable_ccache && steps.setup_ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}

      - name: Collect built kernel module artifact
        run: |
          module_dir="artifact/app/${{ inputs.package_name }}_${{ inputs.kernel_name }}"
          mkdir -p "${module_dir}"
          cp drv/it5570_hwmon.ko "${module_dir}/"
          ls -la "${module_dir}/"

      - name: Upload kernel module artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package_name }}-${{ env.kernel_name }}
          path: artifact
