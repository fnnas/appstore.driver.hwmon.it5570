name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} sha ${{ github.sha }}

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Do you want to create a release?"
        required: true
        type: boolean
        default: false

env:
  package_name: "appstore.driver.hwmon.it5570"
  this_pack_version: "1.0.1"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.vars.outputs.package_name }}
      this_pack_version: ${{ steps.vars.outputs.this_pack_version }}
      driver_revision: ${{ steps.vars.outputs.driver_revision }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Prepare build variables
        id: vars
        run: |
          driver_revision="$(git rev-parse --short HEAD)"
          echo "package_name=${{ env.package_name }}" >> "$GITHUB_OUTPUT"
          echo "this_pack_version=${{ env.this_pack_version }}" >> "$GITHUB_OUTPUT"
          echo "driver_revision=${driver_revision}" >> "$GITHUB_OUTPUT"

  package_driver:
    uses: ./.github/workflows/kernel_space.yml
    secrets: inherit
    needs:
      - setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_name: "6.18.18-trim-427-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-427-amd64"
          - kernel_name: "6.18.18-trim-570-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-570-amd64"
          - kernel_name: "6.18.18-trim-587-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-587-amd64"
          - kernel_name: "6.18.18.c788-trim-amd64"
            kernel_ver: "6.18.18.c788-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c788-trim-amd64"
          - kernel_name: "6.18.18.c877-trim-amd64"
            kernel_ver: "6.18.18.c877-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c877-trim-amd64"
    with:
      package_name: ${{ needs.setup.outputs.package_name }}
      driver_revision: ${{ needs.setup.outputs.driver_revision }}
      kernel_name: ${{ matrix.kernel_name }}
      kernel_ver: ${{ matrix.kernel_ver }}
      container_image: ${{ matrix.container_image }}

  pack_package:
    needs:
      - setup
      - package_driver
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Restore kernel module artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.setup.outputs.package_name }}-6*
          path: package/
          merge-multiple: true

      - name: Render package manifest and scripts
        run: |
          sed "s/this_pack_manifest_version/${{ needs.setup.outputs.this_pack_version }}/g" -i package/manifest
          sed "s/this_pack_manifest_platform/x86/g" -i package/manifest
          sed "s/this_pack_manifest_kernel/6.18.18-trim-427-amd64、6.18.18-trim-570-amd64、6.18.18-trim-587-amd64、6.18.18.c788-trim-amd64、6.18.18.c877-trim-amd64/g" -i package/manifest
          sed "s/this_pack_driver_revision/${{ needs.setup.outputs.driver_revision }}/g" -i package/cmd/main

      - name: Create app payload archive
        run: |
          cd package
          tar zcvf app.tgz app

      - name: Create package archive
        run: |
          tar zcvf ${{ needs.setup.outputs.package_name }}-${{ needs.setup.outputs.this_pack_version }}-${{ needs.setup.outputs.driver_revision }}.tgz \
            --exclude='package/app' \
            package

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.setup.outputs.package_name }}-${{ needs.setup.outputs.this_pack_version }}-${{ needs.setup.outputs.driver_revision }}.tgz
          path: ${{ needs.setup.outputs.package_name }}-${{ needs.setup.outputs.this_pack_version }}-${{ needs.setup.outputs.driver_revision }}.tgz

  create_release:
    if: ${{ inputs.make_release }}
    needs:
      - pack_package
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.this_pack_version }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${{ env.this_pack_version }} already exists, skipping create."
          else
            gh release create "${{ env.this_pack_version }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "fnnas.appstore.driver.hwmon.it5570-${{ env.this_pack_version }}" \
              --prerelease
          fi

  upload_release_assets:
    if: ${{ inputs.make_release }}
    needs:
      - setup
      - create_release
      - pack_package
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.setup.outputs.package_name }}-${{ needs.setup.outputs.this_pack_version }}-${{ needs.setup.outputs.driver_revision }}.tgz
          path: release-assets/

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_name="${{ needs.setup.outputs.package_name }}-${{ needs.setup.outputs.this_pack_version }}-${{ needs.setup.outputs.driver_revision }}.tgz"
          gh release upload "${{ needs.setup.outputs.this_pack_version }}" "release-assets/${package_name}" --repo "${GITHUB_REPOSITORY}" --clobber

  verify_release_assets:
    if: ${{ inputs.make_release }}
    needs:
      - upload_release_assets
    runs-on: ubuntu-latest
    steps:
      - name: Verify Uploaded Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploaded assets:"
          gh release view "${{ env.this_pack_version }}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name'
