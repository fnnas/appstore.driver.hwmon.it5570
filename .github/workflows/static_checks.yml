name: Static Checks

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Check shell syntax
        run: |
          find package/cmd -maxdepth 1 -type f -print0 |
            while IFS= read -r -d '' file; do
              first_line="$(head -n 1 "$file")"
              if [ "$first_line" = "#!/bin/bash" ] || [ "$first_line" = "#!/bin/sh" ]; then
                echo "bash -n $file"
                bash -n "$file"
              fi
            done

      - name: Check package placeholders
        run: |
          grep -q 'this_pack_manifest_version' package/manifest
          grep -q 'this_pack_manifest_platform' package/manifest
          grep -q 'this_pack_manifest_kernel' package/manifest
          grep -q 'this_pack_driver_revision' package/cmd/main
